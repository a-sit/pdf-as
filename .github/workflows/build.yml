name: Build

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'development'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/development' }}

env:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US"
  LIB_NAME: "PDF-AS 5"
  PROJECT_PATH: '.'
  PROJECT_NAME: 'pdf-as'

jobs:
  security-checks:
    name: Security Scans (Dependency/SAST/Secrets)
    runs-on: ubuntu-latest
    env:
      REPO_PATH: repo-${{ github.run_id }}-${{ github.job }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.REPO_PATH }}
          fetch-depth: 0

      - name: Dependency Scanning (OWASP Dependency-Check)
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: ${{ env.PROJECT_NAME }}
          path: ${{ env.REPO_PATH }}
          format: ALL
          args: --noupdate

      - name: SAST (Semgrep)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/java

      - name: Secret Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          path: ${{ env.REPO_PATH }}
          extra_args: --results=verified

  build-and-analyse:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [security-checks]
    env:
      REPO_PATH: repo-${{ github.run_id }}-${{ github.job }}
      
    defaults:
      run:
        working-directory: ${{ env.REPO_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.REPO_PATH }}
          fetch-depth: 2
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compile & Test
        run: ./gradlew --warning-mode all clean build

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: analysis-reports
          path: |
            ${{ env.REPO_PATH }}/**/build/reports/pmd/*.xml
            ${{ env.REPO_PATH }}/**/build/reports/spotbugs/*.xml
            ${{ env.REPO_PATH }}/**/build/reports/checkstyle/*.xml
            ${{ env.REPO_PATH }}/**/build/reports/jacoco/**/jacocoTestReport.xml
            ${{ env.REPO_PATH }}/**/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Extract Pull Request Number
        uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1.3.5
        if: always()
        id: pr

      - name: Detect Test Reports
        id: tests
        if: always()
        run: |
          shopt -s globstar nullglob
          reports=(**/build/test-results/test/TEST-*.xml)
          if [ ${#reports[@]} -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Quality Monitor config
        id: qm
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.tests.outputs.has_tests }}" = "true" ]; then
            echo "name=Run Quality Monitor (with coverage)" >> "$GITHUB_OUTPUT"
            echo 'config={"tests":{"tools":[{"id":"junit","name":"Unittests","pattern":"**/build/test-results/test/TEST-*.xml"}]},"analysis":[{"name":"Style","id":"style","tools":[{"id":"checkstyle","pattern":"**/build/reports/checkstyle/*.xml"}]},{"name":"Code Analyzer","id":"pmd","tools":[{"id":"pmd","pattern":"**/build/reports/pmd/*.xml"}]},{"name":"Bugs","id":"bugs","tools":[{"id":"spotbugs","pattern":"**/build/reports/spotbugs/*.xml"}]}],"coverage":[{"name":"JaCoCo","tools":[{"id":"jacoco","metric":"line","pattern":"**/build/reports/jacoco/**/jacocoTestReport.xml"},{"id":"jacoco","metric":"branch","pattern":"**/build/reports/jacoco/**/jacocoTestReport.xml"}]}]}' >> "$GITHUB_OUTPUT"
            echo 'gates={"qualityGates":[{"metric":"line","threshold":75.0,"criticality":"UNSTABLE"},{"metric":"branch","threshold":75.0,"criticality":"UNSTABLE"},{"metric":"checkstyle","threshold":70.0,"criticality":"UNSTABLE"},{"metric":"pmd","threshold":70.0,"criticality":"UNSTABLE"},{"metric":"spotbugs","threshold":10.0,"criticality":"UNSTABLE"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "name=Run Quality Monitor (without coverage)" >> "$GITHUB_OUTPUT"
            echo 'config={"tests":{"tools":[{"id":"junit","name":"Unittests","pattern":"**/build/test-results/test/TEST-*.xml"}]},"analysis":[{"name":"Style","id":"style","tools":[{"id":"checkstyle","pattern":"**/build/reports/checkstyle/*.xml"}]},{"name":"Code Analyzer","id":"pmd","tools":[{"id":"pmd","pattern":"**/build/reports/pmd/*.xml"}]},{"name":"Bugs","id":"bugs","tools":[{"id":"spotbugs","pattern":"**/build/reports/spotbugs/*.xml"}]}]}' >> "$GITHUB_OUTPUT"
            echo 'gates={"qualityGates":[{"metric":"checkstyle","threshold":70.0,"criticality":"UNSTABLE"},{"metric":"pmd","threshold":70.0,"criticality":"UNSTABLE"},{"metric":"spotbugs","threshold":10.0,"criticality":"UNSTABLE"}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: ${{ steps.qm.outputs.name }}
        if: always()
        uses: uhafner/quality-monitor@79cf0e7b4dbcb99d8c318eb31820d41d1a2a620a # v4.2.0
        continue-on-error: true
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          checks-name: Quality Monitor
          config: ${{ steps.qm.outputs.config }}
          quality-gates: ${{ steps.qm.outputs.gates }}
          
  publishDevelopmentSnapshot:
    name: Publish SNAPSHOT package
    runs-on: ubuntu-latest

    needs: build-and-analyse

    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/development'
      }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout development HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify snapshot version
        shell: bash
        run: |
          version="$(
            ./gradlew properties --quiet |
              sed -n 's/^version: //p' |
              head -n 1
          )"

          case "$version" in
            *-SNAPSHOT)
              echo "Publishing snapshot version: $version"
              ;;
            *)
              echo "::error::Development version is not a SNAPSHOT: $version"
              exit 1
              ;;
          esac
          
      - name: Check development HEAD
        id: development-head
        shell: bash
        run: |
          git fetch --no-tags origin development

          remote_sha="$(git rev-parse origin/development)"

          if [[ "$GITHUB_SHA" == "$remote_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale commit $GITHUB_SHA; development is now $remote_sha"
          fi

      - name: Publish snapshot to GitHub Packages
        if: steps.development-head.outputs.current == 'true'
        run: >
          ./gradlew
          --stacktrace
          publishAllPublicationsToGithubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publishToEGIZMaven:
    name: Assemble Release Package & Publish
    runs-on: [self-hosted, linux]
    needs: build-and-analyse
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    env:
      REPO_PATH: repo-${{ github.run_id }}-${{ github.job }}
      
    defaults:
      run:
        working-directory: ${{ env.REPO_PATH }}
        
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.REPO_PATH }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup SSH known_hosts
        env:
          DEPLOY_EGIZ: ${{ secrets.DEPLOY_EGIZ }}
        run: |
          mkdir -p ~/.ssh
          echo $DEPLOY_EGIZ | base64 --decode > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build and Publish
        run: ./gradlew --stacktrace -x test publish
