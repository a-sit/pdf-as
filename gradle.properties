# Gradle properties for PDF-AS project
# Enable Gradle build cache for better performance
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Configure JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable configuration cache (Gradle 6.6+) - disabled during migration
org.gradle.configuration-cache=false

# Suppress warnings about deprecated features during migration
org.gradle.warning.mode=all