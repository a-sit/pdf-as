apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'eclipse-wtp'
apply plugin: 'war'
apply plugin: 'org.springframework.boot'

buildscript {
  repositories {
	gradlePluginPortal()
    maven {
    	url = "https://plugins.gradle.org/m2/"
    }   
  }

  dependencies {
	classpath group: 'org.springframework.boot', name: 'spring-boot-gradle-plugin', version: springBootVersion
  }
}

configurations {
   tomcatDist
   pdfbox2
   pdfbox3
}
dependencies {
	tomcatDist "org.apache.tomcat:tomcat:${tomcatVersion}@zip"
}

jar {
	enabled = true
    manifest {
        attributes 'Implementation-Title': 'PDF-AS-WEB'
    }
}
bootJar { enabled = false }
war { enabled = false }
bootWar { enabled = true }


repositories {
	mavenLocal()
    mavenCentral()
	maven {
		url = "https://repo.spring.io/milestone/"
    }        
}


// providedCompile configuration removed - using compileOnly instead


dependencies {
    api project (':pdf-as-common')
	api project (':pdf-as-lib')
	api project (':pdf-as-moa')
	api project (':signature-standards:sigs-pkcs7detached')
	api project (':signature-standards:sigs-pades')
	api project (':pdf-as-web-status')
	api project (':pdf-as-web-statistic-api')
	api project (':pdf-as-pdfbox-3')
	api group: 'org.apache.commons', name: 'commons-fileupload2-jakarta-servlet6', version: '2.0.0-M5'
	api group: 'commons-io', name: 'commons-io', version: commonsIoVersion
	api group: 'org.sitemesh', name: 'sitemesh', version: '3.2.1'
	api group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: jaxbApiVersion
	api group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: jaxbRuntimeVersion
    api group: 'jakarta.xml.ws', name: 'jakarta.xml.ws-api', version: jakartaXmlWsVersion
    api group: 'commons-codec', name: 'commons-codec', version: commonsCodecVersion
	api group: 'org.apache.commons', name: 'commons-lang3', version: commonsLang3Version
    api group: 'org.apache.commons', name: 'commons-text', version: commonsTextVersion
	api group: 'org.apache.commons', name: 'commons-collections4', version: commonsCollectionsVersion
	api group: 'org.apache.cxf', name: 'cxf-rt-transports-http', version: cxfVersion
	api group: 'org.apache.cxf', name: 'cxf-rt-frontend-jaxws', version: cxfVersion
	api 'com.thetransactioncompany:cors-filter:3.1'
	api group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
	api group: 'ch.qos.logback', name: 'logback-core', version: logbackVersion
	api group: 'org.json', name: 'json', version: jsonVersion
	api group: 'jakarta.jws', name: 'jakarta.jws-api', version: jakartaJwsVersion
	compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: jakartaServletVersion
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter', version: springBootVersion
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: springBootVersion
	providedRuntime group: 'org.springframework.boot', name: 'spring-boot-starter-tomcat', version: springBootVersion
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version: springBootVersion
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	providedRuntime group: 'org.apache.tomcat.embed', name: 'tomcat-embed-jasper', version: tomcatVersion
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
	implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations'
    testImplementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: jakartaServletVersion
    testImplementation 'org.springframework:spring-test'
	testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: springBootVersion
	testImplementation group: 'org.apache.cxf', name: 'cxf-rt-transports-http-jetty', version: cxfVersion
}

bootRun {
	jvmArgs = [ '-Dpdf-as-web.conf=' + System.getProperty("user.home") + '/.pdfas/pdf-as-web.properties' ]
}


test {
    systemProperties 'pdf-as-web.conf': System.getProperty("user.home") + '/.pdfas/pdf-as-web.properties'
}

def tomcatVer = tomcatVersion
def tomcatDir = layout.buildDirectory.dir("tomcat-bundling")
def tomcatHome = tomcatDir.map { it.dir("apache-tomcat-${tomcatVer}") }
def releasesDirectory = layout.projectDirectory.dir("releases/${project.version}")

tasks.register('extractTomcat', Sync) {
	from({
		zipTree(configurations.tomcatDist.singleFile)
	})
	into(tomcatDir)
}

tasks.register('cleanWebAppsInTomcat', Delete) {
    dependsOn('extractTomcat')
	delete(tomcatHome.map { it.dir("webapps") })
}

tasks.register('putTemplateIntoTomcat', Copy) {
    dependsOn('cleanWebAppsInTomcat')
	from("src/main/assembly/tomcat")
	into(tomcatHome)
}

tasks.register('putConfigIntoTomcat', Copy) {
    dependsOn(':pdf-as-lib:processResources', 'putTemplateIntoTomcat')
	from(zipTree(project(':pdf-as-lib').layout.buildDirectory.file('resources/main/config/config.zip')))
	into(tomcatHome.map { it.dir("conf/pdf-as") })
}

tasks.register('putWebConfigIntoTomcat', Copy) {
    dependsOn('putConfigIntoTomcat')
	from("src/main/configuration")
	into(tomcatHome.map { it.dir("conf/pdf-as") })
}

tasks.register('injectPdfAsWebApp', Copy) {
    dependsOn('bootWar')
    dependsOn('putWebConfigIntoTomcat')
	from(tasks.named('bootWar').flatMap { it.archiveFile })
	into(tomcatHome.map { it.dir("webapps") })
	rename { "pdf-as-web.war" }
}

tasks.register('buildTomcatZip', Zip) {
    dependsOn('injectPdfAsWebApp')
	from(tomcatDir)
	archiveFileName = "apache-tomcat-${tomcatVer}-pdf-as-web-${project.version}.zip"
	destinationDirectory = layout.buildDirectory
}

tasks.register('buildTomcatTar', Tar) {
    dependsOn('injectPdfAsWebApp')
	from(tomcatDir)
	archiveFileName = "apache-tomcat-${tomcatVer}-pdf-as-web-${project.version}.tar"
	destinationDirectory = layout.buildDirectory
	compression = Compression.NONE
}

tasks.register('releaseConfig', Copy) {
	from('src/main/configuration/pdf-as-web.properties')
	into(releasesDirectory.dir("cfg"))
}

tasks.register('releases', Copy) {
    dependsOn('jar', 'sourcesJar', 'bootWar', 'releaseConfig', 'buildTomcatZip', 'buildTomcatTar')

	from(tasks.named('jar').flatMap { it.archiveFile })
	from(tasks.named('sourcesJar').flatMap { it.archiveFile })
	from(tasks.named('bootWar').flatMap { it.archiveFile })
	from(tasks.named('buildTomcatZip').flatMap { it.archiveFile })
	from(tasks.named('buildTomcatTar').flatMap { it.archiveFile })
	into(releasesDirectory)
}
